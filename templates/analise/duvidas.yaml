#   objetivo: "interno: por que perguntamos"
#   resposta_desejada: "interno: a resposta que nos favorece"
#   impacto: "interno: o que muda na análise/resposta conforme a resposta"
#   gates: [G2]                        # opcional: gates que a resposta pode reabrir
#   prioridade: Alta                   # Alta | Média | Baixa
#   status: PENDENTE                   # PENDENTE | ENVIADA | RESPONDIDA | RETIRADA
#   resposta_cliente: ""               # quando o cliente responder
