# Registro de evidências DESTE estudo: alegações que sustentam decisões (gate, direcionamento, resposta negativa,
# risco, recomendação). É o que um avaliador ou o cliente vai questionar — cada linha precisa de fonte e citação.
# Vai para 00-projeto/evidencias/registro-evidencias.md e as URLs entram em 'python kit.py validar-urls'.
#
# Diferente da KB: aqui cabe o que é específico do edital (cláusulas do próprio edital, respostas do fabricante a
# este processo, leitura de uma exigência do cliente). O que for fato público e reaproveitável vai para
# kb/evidencias/<fornecedor>.yaml — e aqui você só aponta com 'kb:'.
#
# - id: EV-0001
#   tema: "Gate G2 — região de dados no Brasil"
#   fornecedor: datadog                # opcional: a alegação aparece no dossiê do fornecedor
#   alegacao: "O fornecedor não oferece região de dados no Brasil."
#   fonte: "https://..."               # URL oficial, ou "edital: <arquivo> item 4.2" para cláusula do edital
#   data_acesso: 2026-01-15
#   citacoes: ["trecho literal da fonte"]
#   confianca: alta                    # alta | media | baixa
#   impacto: "Reprova o gate G2 (eliminatório)."
#   usado_em: ["G2", "memorial §3"]    # opcional
#   palavras_chave: ["region"]         # opcional: conferidas na página por 'validar-urls'
#
# - id: EV-0002
#   tema: "Resposta negativa ao item de session replay"
#   kb: EV-AZ-040                      # reaproveita a evidência pública da KB (herda URL, alegação e citações)
#   confianca: alta
#   impacto: "Sustenta a resposta 'Não atende' e a ressalva do memorial."
- id: EV-0001
  tema: "RF-04 — crashes de aplicativos móveis (resposta Não Atende)"
  kb: EV-AZ-045
  confianca: alta
  impacto: "Sustenta o 'Não Atende' do RF-04 (a alternativa nativa está em preview) e a pergunta DUV-001 sobre aceitar OpenTelemetry."
  usado_em: [RF-04, DUV-001]

- id: EV-0002
  tema: "Gate G2 — SLA de disponibilidade publicado"
  kb: EV-AZ-046
  confianca: alta
  impacto: "Sustenta PASSA no gate eliminatório G2 (SLA publicado, com edição em português)."
  usado_em: [G2]

- id: EV-0003
  tema: "RF-05 — alcance de 'live tail' no edital"
  fornecedor: azure-monitor
  alegacao: "O edital pede live tail de logs em tempo real sem definir latência máxima nem o formato (texto bruto ou telemetria); a resposta parcial vale até a DUV-003 ser respondida."
  fonte: "edital: Matriz-Requisitos-Exemplo.xlsx, item RF-05"
  citacoes: ["Live tail de logs em tempo real."]
  confianca: media
  impacto: "Justifica 'Atende Parcialmente' no RF-05 e a dúvida DUV-003."
  usado_em: [RF-05, DUV-003]
