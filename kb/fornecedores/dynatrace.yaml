notas_base:
  coleta:
    nota: 0.95
    obs: "OneAgent oferece auto-descoberta, ampla matriz de plataformas e ingestão OTLP; a ressalva é o agente proprietário."
    fontes: ["https://docs.dynatrace.com/docs/ingest-from/dynatrace-oneagent", "https://docs.dynatrace.com/docs/ingest-from/technology-support/oneagent-platform-and-capability-support-matrix", "https://docs.dynatrace.com/docs/ingest-from/opentelemetry"]
  infraestrutura:
    nota: 1.0
    obs: "Cobertura nativa forte para hosts, processos, containers, Kubernetes, rede e nuvens."
    fontes: ["https://docs.dynatrace.com/docs/observe/infrastructure-observability/infrastructure-and-operations", "https://docs.dynatrace.com/docs/ingest-from/dynatrace-oneagent"]
  apm:
    nota: 1.0
    obs: "APM, PurePath, tracing e topologia automática são capacidades centrais da plataforma."
    fontes: ["https://docs.dynatrace.com/docs/observe/application-observability/distributed-tracing", "https://docs.dynatrace.com/docs/ingest-from/opentelemetry"]
  logs:
    nota: 0.9
    obs: "Logs no Grail com DQL, OpenPipeline, parsing, mascaramento e extração de métricas."
    fontes: ["https://docs.dynatrace.com/docs/analyze-explore-automate/logs", "https://docs.dynatrace.com/docs/platform/grail/dynatrace-query-language"]
  correlacao:
    nota: 1.0
    obs: "Grail, Smartscape e Davis fornecem correlação e análise causal entre sinais."
    fontes: ["https://docs.dynatrace.com/docs/dynatrace-intelligence/anomaly-detection", "https://docs.dynatrace.com/docs/platform/grail/dynatrace-query-language"]
  banco-dados:
    nota: 0.9
    obs: "Observabilidade de banco combina serviços vistos pela aplicação e extensões de engine; profundidade varia por tecnologia."
    fontes: ["https://docs.dynatrace.com/docs/observe/infrastructure-observability/databases/get-started"]
  experiencia-usuario:
    nota: 1.0
    obs: "RUM web/mobile, Session Replay e sintéticos são recursos nativos."
    fontes: ["https://docs.dynatrace.com/docs/observe/digital-experience/rum"]
  alertas-dashboards:
    nota: 1.0
    obs: "SLOs, dashboards e alertas com baselines e Davis AI são bem integrados."
    fontes: ["https://docs.dynatrace.com/docs/deliver/service-level-objectives/create-slo", "https://docs.dynatrace.com/docs/dynatrace-intelligence/anomaly-detection"]
  aiops:
    nota: 1.0
    obs: "Davis AI é um componente central para anomalia, causa raiz e redução de ruído."
    fontes: ["https://docs.dynatrace.com/docs/dynatrace-intelligence/anomaly-detection"]
  ia-llm:
    nota: 0.75
    obs: "AI Observability cobre GenAI/LLM via OpenTelemetry e OpenLLMetry, mas é uma área recente."
    fontes: ["https://docs.dynatrace.com/docs/observe/dynatrace-for-ai-observability", "https://docs.dynatrace.com/docs/ingest-from/opentelemetry"]
  profiling:
    nota: 0.9
    obs: "Always-on profiling e Live Debugger são fortes, mas dependem do OneAgent."
    fontes: ["https://docs.dynatrace.com/docs/observe/application-observability/services/always-on-app-profiling"]
  dados-pipelines:
    nota: 0.5
    obs: "Não há produto dedicado de data observability; pipelines podem ser modelados por eventos, logs e DQL."
    fontes: ["https://docs.dynatrace.com/docs/platform/grail/dynatrace-query-language", "https://docs.dynatrace.com/docs/analyze-explore-automate/logs"]
  seguranca-governanca:
    nota: 0.9
    obs: "SSO, SCIM, RBAC/policies, audit log e integrações corporativas são robustos."
    fontes: ["https://docs.dynatrace.com/docs/manage/identity-access-management/user-and-group-management/access-saml", "https://docs.dynatrace.com/docs/platform/grail/dynatrace-query-language"]
  integracoes-itsm:
    nota: 1.0
    obs: "Integrações ServiceNow e fluxos de notificação são suportados na plataforma."
    fontes: ["https://docs.dynatrace.com/docs/manage/identity-access-management/user-and-group-management/access-saml", "https://ir.dynatrace.com/news-events/press-releases/detail/192/dynatrace-launches-software-intelligence-hub"]
  plataforma:
    nota: 0.75
    obs: "Há SaaS e opção gerenciada pelo cliente, com retenção forte; região no Brasil não foi confirmada e o SLA SaaS público é 99,5%."
    fontes: ["https://www.dynatrace.com/company/trust-center/sla/saas/", "https://docs.dynatrace.com/managed", "https://dynatrace.status.io/"]
destaques:
  - "APM, topologia, correlação e causa raiz são pontos fortes da plataforma."
  - "Retenção de métricas no Grail é forte e documentada."
  - "RUM, Session Replay e sintéticos têm cobertura ampla."
  - "Existe opção self-managed para cenários que exigem controle de implantação."
gaps:
  - "OneAgent não é open source."
  - "Região de dados no Brasil não foi confirmada em fonte pública."
  - "SLA SaaS publicado é inferior a 99,8%."
  - "Data observability dedicada requer construção customizada."
