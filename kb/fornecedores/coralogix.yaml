id: coralogix
nome: Coralogix
fabricante: Coralogix Ltd.
produto: "Coralogix Telemetry Lake Platform"
aliases: []
entrega: [saas]
atualizado_em: 2026-09-29
ttl_dias: 180
confianca: Alta
fatos:
  integracoes_nativas: {valor: 300, qualificador: "mais de", texto: "View all 300+ integrations", fonte: "https://coralogix.com/platform/integrations/", verificado_em: 2026-09-29, obs: "Número de marketing exibido no site oficial (também '300+ extensions' em https://coralogix.com/solutions/data-pipeline-services/); o catálogo é renderizado via JS e a contagem exata não foi auditada."}
  sla_disponibilidade_pct: {valor: 99.9, fonte: "https://coralogix.com/coralogix-uptime-sla/", verificado_em: 2026-09-29, obs: "Monthly Uptime Percentage 24x7 de 99,9%; créditos de 10% (99,0–99,9%) e 30% (<99,0%), não aplicáveis a Pay-as-you-Go, beta ou trial; rescisão por falha crônica abaixo de 97,5%."}
  regiao_dados_brasil: {valor: "NAO", fonte: "https://coralogix.com/docs/user-guides/account-management/account-settings/coralogix-domain/", verificado_em: 2026-09-29, obs: "Regiões: US1 Ohio, US2 Oregon, US3 Iowa (GCP), EU1 Irlanda, EU2 Estocolmo, AP1 Mumbai, AP2 Singapura, AP3 Jacarta e GOV1 (GovCloud); nenhuma no Brasil. O bucket de arquivo do cliente deve estar na mesma região da conta (https://coralogix.com/docs/user-guides/data-flow/s3-archive/connect-s3-archive/), logo não pode ficar em São Paulo."}
  suporte_ptbr: {valor: "NAO", fonte: "https://coralogix.com/support-policy/", verificado_em: 2026-09-29, obs: "Support Policy, item 6.3: 'Coralogix Support Services are available exclusively in English.' Suporte 24x7 via chat in-app e e-mail."}
  agente_open_source: {valor: "SIM", texto: "Apache-2.0: coleta via OpenTelemetry Collector Contrib upstream (otelcol-contrib), com instaladores e Helm charts do fabricante em https://github.com/coralogix/telemetry-shippers (Apache 2.0); SDK RUM Android também Apache-2.0.", fonte: "https://github.com/coralogix/telemetry-shippers", verificado_em: 2026-09-29}
  opentelemetry: {valor: "SIM", fonte: "https://coralogix.com/docs/integrations/coralogix-endpoints/", verificado_em: 2026-09-29, obs: "Endpoint nativo OTLP/gRPC e OTLP/HTTP para logs, métricas e traces; APM, bancos e profiling são derivados de sinais OTel."}
  retencao_metricas_meses: {valor: null, fonte: "https://coralogix.com/pricing/", verificado_em: 2026-09-29, obs: "Sem teto em meses: a página de preços indica para Metrics 'Infinite retention' e 'Stored in your bucket'; a retenção é política definida pelo cliente no próprio bucket."}
  retencao_metricas_integral: {valor: "PARCIAL", fonte: "https://coralogix.com/docs/api-reference/v5/metrics-data-archive-service/configure-tenant/", verificado_em: 2026-09-29, obs: "A API (e o Terraform) expõem retentionPolicy em dias por resolução (raw, 5 min, 1 h), indicando downsampling configurável; o site promete 'full fidelity' a 15 s, mas não há garantia documentada de retenção raw ilimitada."}
  so_suportados: {valor: [linux, windows, macos, arm], fonte: "https://github.com/coralogix/telemetry-shippers/blob/master/otel-installer/README.md", verificado_em: 2026-09-29, obs: "Linux e macOS (x86_64/arm64), Windows 10/11 e Server 2016+ (x64/ARM64), além de Docker/Kubernetes; nada documentado para AIX, Solaris, HP-UX ou z/OS."}
  self_managed: {valor: "NAO", fonte: "https://trust.coralogix.com/", verificado_em: 2026-09-29, obs: "Plataforma 'multi-tenant, cloud-hosted SaaS'; os dados em repouso podem ficar no bucket do cliente (BYO storage) e componentes de ingestão BYOC existem apenas no ambiente FedRAMP GOV1."}
  rum_mobile: {valor: "SIM", fonte: "https://coralogix.com/docs/user-guides/rum/sdk-installation/android/", verificado_em: 2026-09-29, obs: "SDKs nativos Android e iOS (iOS 13+, https://coralogix.com/docs/user-guides/rum/sdk-installation/apple/ios/), além de React Native e Flutter."}
  session_replay: {valor: "SIM", fonte: "https://coralogix.com/docs/user-guides/rum/product-features/session-replay/", verificado_em: 2026-09-29, obs: "Disponível para web, iOS, Android, React Native e Flutter, sem marcação Beta/Preview; mascara texto, entradas e mídia por padrão."}
  certificacoes: {valor: ["ISO27001", "ISO27017", "ISO27018", "ISO27701", "ISO42001", "SOC2 Type II", "PCI-DSS v4.0.1", "HIPAA", "FedRAMP"], fonte: "https://trust.coralogix.com/", verificado_em: 2026-09-29, obs: "O Trust Center também lista GDPR, DORA, CCPA e EU-US DPF (conformidade); FedRAMP vale só para o ambiente GOV1 (AWS GovCloud). LGPD não é citada."}
notas_base:
  coleta: {nota: 0.85, obs: "Coleta nativa OpenTelemetry (otelcol-contrib, Apache 2.0) com instaladores Linux/macOS/Windows (x64/ARM64), Helm para Kubernetes, Fleet Management via OpAMP e 300+ integrações. Não há agentes para Unix legados (AIX/Solaris/HP-UX).", fontes: ["https://github.com/coralogix/telemetry-shippers/blob/master/otel-installer/README.md", "https://coralogix.com/platform/integrations/", "https://coralogix.com/docs/user-guides/fleet-management/overview/"]}
  infraestrutura: {nota: 0.7, obs: "Cobre hosts, Kubernetes (Infrastructure Explorer com relações pod/nó), AWS/Azure/GCP e serverless (Lambda). Monitoramento de rede via SNMP/NetFlow não é documentado.", fontes: ["https://coralogix.com/docs/user-guides/infrastructure/infrastructure-explorer/overview/", "https://coralogix.com/docs/integrations/aws/aws-lambda-telemetry-exporter/", "https://coralogix.com/platform/infrastructure-monitoring/"]}
  apm: {nota: 0.75, obs: "APM v2 sobre OpenTelemetry com catálogo de serviços, service map, erros, runtime metrics e perfis. Auto-instrumentação via operador OTel no Kubernetes e eBPF (OBI), sem agente proprietário.", fontes: ["https://coralogix.com/docs/user-guides/apm-v2/", "https://coralogix.com/docs/opentelemetry/kubernetes-observability/opentelemetry-autoinstrumentation/", "https://coralogix.com/docs/opentelemetry/instrumentation-options/ebpf-auto-instrumentation/overview/"]}
  logs: {nota: 0.95, obs: "Ponto forte: parsing e enriquecimento in-stream (Streama), consulta DataPrime/Lucene, LiveTail e arquivo Parquet no bucket do cliente consultável sem reidratação. Mascaramento de PII por regras de parsing ou processadores OTel.", fontes: ["https://coralogix.com/docs/user-guides/data_exploration/logs/livetail/", "https://coralogix.com/docs/user-guides/data-query/archive-query/archive-query-from-the-explore-screen/", "https://coralogix.com/docs/user-guides/account-management/data-privacy/handling-pii-and-sensitive-data/"]}
  correlacao: {nota: 0.8, obs: "Logs, métricas, traces, perfis e RUM no mesmo 'telemetry lake', com correlação e joins via DataPrime. Service map derivado de traces e mapa de relações de infraestrutura.", fontes: ["https://coralogix.com/platform-telemetry-lake", "https://coralogix.com/docs/user-guides/apm-v2/features/service-map/", "https://coralogix.com/docs/user-guides/infrastructure/infrastructure-explorer/overview/"]}
  banco-dados: {nota: 0.5, obs: "Bancos aparecem como entidades no APM v2 a partir de spans de cliente (throughput, latência e erros por operação/tabela), sem agente de banco. Não há planos de execução nem métricas internas de SGBD documentadas.", fontes: ["https://coralogix.com/docs/user-guides/apm-v2/databases/"]}
  experiencia-usuario: {nota: 0.7, obs: "RUM web e mobile (Android, iOS, React Native, Flutter) com session replay GA. Monitoramento sintético apenas via terceiros (Checkly/Telegraf).", fontes: ["https://coralogix.com/docs/user-guides/rum/product-features/session-replay/", "https://coralogix.com/docs/user-guides/rum/sdk-installation/android/", "https://coralogix.com/docs/user-guides/monitoring-and-insights/synthetic-monitoring/synthetic-monitoring-with-checkly/"]}
  alertas-dashboards: {nota: 0.7, obs: "Dashboards customizados, alertas de logs/métricas/traces (inclui anomalia e flow alerts), Cases com regras de redução de ruído e Notification Center. SLO/error budget ainda em Beta e escalonamento depende de PagerDuty/Opsgenie.", fontes: ["https://coralogix.com/docs/user-guides/slos/introduction/", "https://coralogix.com/docs/user-guides/alerting/introduction-to-alerts/", "https://coralogix.com/docs/user-guides/cases/cases-setting/"]}
  aiops: {nota: 0.8, obs: "Olly responde em linguagem natural e executa RCA autônomo, inclusive análise automática de Cases; alertas de anomalia usam baseline preditivo de 24 h. Previsão de capacidade de longo prazo não é documentada.", fontes: ["https://coralogix.com/docs/user-guides/olly/autonomous-agent/", "https://coralogix.com/docs/user-guides/alerting/create-an-alert/metrics/anomaly-detection-alerts/", "https://coralogix.com/docs/user-guides/cases/cases-setting/"]}
  ia-llm: {nota: 0.9, obs: "AI Center cobre monitoramento de apps LLM (custo, tokens, latência, erros), avaliações de qualidade e segurança (alucinação, toxicidade, PII), guardrails em tempo real, AI-SPM e agentes de código via OTLP.", fontes: ["https://coralogix.com/docs/user-guides/ai/", "https://coralogix.com/docs/user-guides/ai/guardrails/"]}
  profiling: {nota: 0.8, obs: "Continuous Profiling GA baseado no OpenTelemetry eBPF profiler (JVM, Node.js, Python, .NET, Go, Ruby, PHP, Rust, C/C++ e outros), integrado ao APM. Perfis de memória só para JVM, Node.js e Go.", fontes: ["https://coralogix.com/docs/user-guides/continuous-profiling/supported-languages/", "https://coralogix.com/docs/user-guides/continuous-profiling/introduction/"]}
  dados-pipelines: {nota: 0.25, obs: "Não há módulo de observabilidade de dados (freshness, qualidade, linhagem). Apenas spans com atributos Spark/Airflow/dbt no Explore e ingestão de Kafka/MSK.", fontes: ["https://coralogix.com/docs/user-guides/data_exploration/spans/tables-and-flows/", "https://coralogix.com/docs/integrations/aws/aws-msk-and-kafka/"]}
  seguranca-governanca: {nota: 0.85, obs: "RBAC com políticas e escopos de dados, SSO SAML, SCIM, 2FA, auditoria, AES-256 em repouso e TLS 1.2+, com certificações ISO 27001/27017/27018/27701/42001, SOC 2 Tipo II, PCI DSS e HIPAA. LGPD não é citada.", fontes: ["https://trust.coralogix.com/", "https://coralogix.com/technical-and-organizational-measures/", "https://coralogix.com/docs/user-guides/account-management/user-management/sso-with-saml/"]}
  integracoes-itsm: {nota: 0.75, obs: "Cases criam e sincronizam incidentes no ServiceNow e no PagerDuty; há app nativo para Teams, Slack, Opsgenie, Jira via webhook e APIs/MCP. Integração com CMDB não documentada.", fontes: ["https://coralogix.com/docs/user-guides/cases/sn-integration/", "https://coralogix.com/docs/user-guides/alerting/outbound-webhooks/jira-outbound-webhooks/", "https://coralogix.com/docs/user-guides/notification-center/destination-types/msteams/"]}
  plataforma: {nota: 0.55, obs: "Somente SaaS multi-tenant, com SLA de 99,9% e retenção ilimitada no bucket do cliente. Sem região no Brasil e suporte 24x7 exclusivamente em inglês.", fontes: ["https://coralogix.com/coralogix-uptime-sla/", "https://coralogix.com/docs/user-guides/account-management/account-settings/coralogix-domain/", "https://coralogix.com/support-policy/"]}
destaques:
  - "Arquitetura 'telemetry lake': logs e traces em Parquet e métricas em formato aberto, gravados no bucket do próprio cliente, com retenção ilimitada e consulta remota sem reidratação."
  - "Coleta 100% OpenTelemetry (otelcol-contrib, Apache 2.0) com instaladores Linux/macOS/Windows, ARM64 e Fleet Management via OpAMP."
  - "Streama processa, enriquece e alerta in-stream antes do armazenamento, e a DataPrime unifica a consulta entre sinais."
  - "AI Center (observabilidade de LLM, avaliações e guardrails) e Olly (agente autônomo de RCA em linguagem natural) são diferenciais em IA."
  - "Amplo portfólio de conformidade: ISO 27001/27017/27018/27701/42001, SOC 2 Tipo II, PCI DSS v4.0.1, HIPAA e FedRAMP."
  - "Preço por volume de dados, sem cobrança por host ou usuário, com suporte 24x7 incluído."
gaps:
  - "Não há região de dados no Brasil, e o bucket de arquivo precisa estar na mesma região da conta, portanto não pode ficar em São Paulo."
  - "O suporte oficial é prestado exclusivamente em inglês (Support Policy, item 6.3)."
  - "Não existe opção self-managed/on-premises: a plataforma é só SaaS, e o BYOC de ingestão se limita ao ambiente FedRAMP."
  - "SLO/error budget está em Beta, e não há monitoramento sintético nativo (depende de Checkly/Telegraf)."
  - "Faltam monitoramento de rede SNMP/NetFlow e agentes para AIX/Solaris/HP-UX/z/OS; o monitoramento de banco não mostra planos de execução."
  - "A retenção de métricas é configurada por resolução (raw/5 min/1 h), o que sugere downsampling; não há garantia documentada de granularidade integral no longo prazo."
