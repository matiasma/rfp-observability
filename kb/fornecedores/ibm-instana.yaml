id: ibm-instana
nome: IBM Instana
fabricante: IBM
produto: IBM Instana Observability
aliases: [IBM, Instana, IBM Concert]
entrega: [saas, self-managed]
atualizado_em: 2026-09-29
ttl_dias: 180
confianca: Alta
fatos:
  integracoes_nativas: {valor: 300, qualificador: "mais de", texto: "Over 300 supported technologies", fonte: "https://www.ibm.com/products/instana", verificado_em: 2026-09-29}
  sla_disponibilidade_pct: {valor: 99.9, fonte: "https://www.ibm.com/support/customer/csol/terms/?id=i126-8959", verificado_em: 2026-09-29, obs: "Service Description i126-8959-22 (06/2026), seção 3.1: créditos de 2%/5%/10% do valor mensal abaixo de 99,9%/99,0%/95,0%."}
  regiao_dados_brasil: {valor: SIM, fonte: "https://www.ibm.com/docs/en/instana-observability/saas?topic=planning-preparing-endpoints-keys", verificado_em: 2026-09-29, obs: "Região SaaS 'AWS LATAM – São Paulo (sa-east-1)' nos endpoints de agente, serverless e EUM (ingress-yellow-saas.instana.io). A página comercial de deployment options não cita LATAM e o DPA não lista o Brasil como hosting da IBM."}
  suporte_ptbr: {valor: NAO_DOCUMENTADO, fonte: "https://www.ibm.com/support/customer/csol/terms/?id=E7505A603A3611EBA94E77C5BC708D24", verificado_em: 2026-09-29, obs: "O DPA do Instana SaaS lista o Brasil como local de 'Customer Support' (help desk/suporte técnico) e 'Operations', e a IBM Brasil tem canais locais (https://www.ibm.com/br-pt/contact), mas o atendimento em português não é explicitado para o Instana."}
  agente_open_source: {valor: PARCIAL, texto: "Tracers/sensores (Node.js, Go, Python, Ruby) e agentes web/mobile (weasel, iOS, Android, Flutter, React Native) sob MIT; operator, Helm charts e IDOT (OTel Collector) sob Apache-2.0 em https://github.com/instana. O host agent é Enabling Software sob licença IBM proprietária (L-TVYS-LTAQBR, Service Description i126-8959 §5.7), sem código público.", fonte: "https://github.com/instana", verificado_em: 2026-09-29}
  opentelemetry: {valor: SIM, fonte: "https://www.ibm.com/docs/en/instana-observability/saas?topic=opentelemetry", verificado_em: 2026-09-29, obs: "Traces, métricas e logs OTel em GA; spans OTel combinados com AutoTrace; envio OTLP ao agente ou ao backend e distribuição própria do Collector (IDOT)."}
  retencao_metricas_meses: {valor: 13, fonte: "https://www.ibm.com/docs/en/instana-observability/saas?topic=policies", verificado_em: 2026-09-29, obs: "Granularidade de 1 h mantida por pelo menos 13 meses."}
  retencao_metricas_integral: {valor: NAO, fonte: "https://www.ibm.com/docs/en/instana-observability/saas?topic=policies", verificado_em: 2026-09-29, obs: "1/5/10 s por 24 h; 1 min por 1 mês; 5 min por 3 meses; 1 h por ≥13 meses."}
  so_suportados: {valor: [linux, windows, macos, aix, solaris, zos, arm], fonte: "https://www.ibm.com/docs/en/instana-observability/saas?topic=agents-installing-host", verificado_em: 2026-09-29, obs: "UNIX = AIX 7.x (PowerPC) e Solaris 10+ (SPARC); Linux inclui arm/arm64, ppc64le e s390x; z/OS via USS (JVM, WebSphere, Liberty) com métricas de host via OMEGAMON; IBM i também suportado; HP-UX não listado."}
  self_managed: {valor: SIM, fonte: "https://www.ibm.com/docs/en/instana-observability/saas?topic=planning-instana-deployment-options", verificado_em: 2026-09-29, obs: "Standard Edition (stanctl, Linux x86_64/arm64) e Custom Edition (Kubernetes/OpenShift) com o mesmo conjunto de funções do SaaS e suporte a air-gapped; Classic (Docker) perde suporte em 17/09/2027."}
  rum_mobile: {valor: SIM, fonte: "https://www.ibm.com/docs/en/instana-observability/saas?topic=instana-monitoring-mobile-applications", verificado_em: 2026-09-29, obs: "Agentes nativos iOS e Android, além de React Native e Flutter, com análise de crashes."}
  session_replay: {valor: NAO, fonte: "https://automation-management.ideas.ibm.com/ideas/INSTANA-I-63", verificado_em: 2026-09-29, obs: "O pedido 'Enhance EUM to include Session Replay' segue aberto no IBM Ideas, e o recurso não aparece na documentação de website monitoring."}
  certificacoes: {valor: ["ISO27001", "ISO27017", "ISO27018", "ISO27701", "CSA STAR Level 1", "CSA STAR Level 2", "SOC2 Type 1"], fonte: "https://www.ibm.com/support/customer/csol/terms/?id=E7505A603A3611EBA94E77C5BC708D24", verificado_em: 2026-09-29, obs: "DPA Exhibit v19 (05/2026) do Instana SaaS. A oferta separada Instana for Government tem FedRAMP Moderate (https://www.ibm.com/products/instana/deployment-options)."}
notas_base:
  coleta: {nota: 0.9, obs: "Agente único com autodescoberta e mais de 300 tecnologias, cobrindo Linux (incl. s390x/ppc64le/arm64), Windows, macOS, AIX, Solaris, IBM i e z/OS. Ingestão OTLP nativa e distribuição própria do OTel Collector (IDOT).", fontes: ["https://www.ibm.com/products/instana", "https://www.ibm.com/docs/en/instana-observability/saas?topic=agents-installing-host", "https://www.ibm.com/docs/en/instana-observability/saas?topic=opentelemetry"]}
  infraestrutura: {nota: 0.85, obs: "Hosts, AWS/Azure/GCP/IBM Cloud, Kubernetes/OpenShift, serverless, vSphere/Power e mainframe (CICS, IMS, Db2 z/OS via OMEGAMON). Rede só via SNMP (receptor OTel), Cilium em preview ou integração com o Concert Network Observability.", fontes: ["https://www.ibm.com/docs/en/instana-observability/saas?topic=configuring-monitoring-supported-technologies", "https://www.ibm.com/docs/en/instana-observability/saas?topic=capabilities-mainframe-observability", "https://www.ibm.com/docs/en/instana-observability/saas?topic=otelhost-snmp-enabled-host"]}
  apm: {nota: 0.95, obs: "AutoTrace instrumenta sem alterar código e captura cada requisição com granularidade de 1 s, com erros correlacionados. Tracers para Java, .NET, Node.js, Go, Python, Ruby e PHP, com tracing fim a fim até CICS/IMS.", fontes: ["https://www.ibm.com/docs/en/instana-observability/saas?topic=capabilities-distributed-tracing", "https://www.ibm.com/docs/en/instana-observability/saas?topic=requirements-instana-agent", "https://www.ibm.com/docs/en/instana-observability/saas?topic=capabilities-mainframe-observability"]}
  logs: {nota: 0.5, obs: "Coleta via tracers, sensores de contêiner e OTel, com correlação a traces e Smart Alerts de logs; retenção padrão de 7 dias (30/60/90 via add-on). Sem pipelines de parsing, arquivamento/reidratação ou mascaramento de PII documentados.", fontes: ["https://www.ibm.com/docs/en/instana-observability/saas?topic=instana-logging", "https://www.ibm.com/docs/en/instana-observability/saas?topic=policies", "https://www.ibm.com/support/customer/csol/terms/?id=i126-8959"]}
  correlacao: {nota: 0.9, obs: "O modelo de dependências relaciona automaticamente infraestrutura, serviços, traces, logs e eventos, com mapa de dependências e mapa de infraestrutura em tempo real. Correlaciona spans OTel e EUM com o backend, inclusive mainframe.", fontes: ["https://www.ibm.com/docs/en/instana-observability/saas?topic=capabilities-distributed-tracing", "https://www.ibm.com/docs/en/instana-observability/saas?topic=capabilities-infrastructure-map", "https://www.ibm.com/docs/en/instana-observability/saas?topic=capabilities-events-incidents"]}
  banco-dados: {nota: 0.7, obs: "Sensores para SQL Server, Oracle (RAC/multitenant), PostgreSQL, MySQL, MongoDB e Db2 (LUW, IBM i e z/OS via OMEGAMON), com top queries e tempos de espera. Planos de execução não documentados.", fontes: ["https://www.ibm.com/docs/en/instana-observability/saas?topic=technologies-monitoring-microsoft-sql-server", "https://www.ibm.com/docs/en/instana-observability/saas?topic=technologies-monitoring-oracledb", "https://www.ibm.com/docs/en/instana-observability/saas?topic=technologies-monitoring-omegamon"]}
  experiencia-usuario: {nota: 0.7, obs: "RUM web (agente JS, SPA, correlação com backend), mobile (iOS, Android, React Native, Flutter, crashes) e sintético (browser/API, PoPs gerenciados e privados). Sem session replay.", fontes: ["https://www.ibm.com/docs/en/instana-observability/saas?topic=instana-monitoring-websites", "https://www.ibm.com/docs/en/instana-observability/saas?topic=instana-monitoring-mobile-applications", "https://www.ibm.com/docs/en/instana-observability/saas?topic=capabilities-synthetic-monitoring"]}
  alertas-dashboards: {nota: 0.85, obs: "Dashboards customizados, Smart Alerts com blueprints e limiares adaptativos, SLOs com error budget/burn rate e automação de ações com aprovação e auditoria. Plantão e escalonamento ficam a cargo de ferramentas externas (PagerDuty, Opsgenie).", fontes: ["https://www.ibm.com/docs/en/instana-observability/saas?topic=capabilities-service-level-objectives", "https://www.ibm.com/docs/en/instana-observability/saas?topic=capabilities-smart-alerts", "https://www.ibm.com/docs/en/instana-observability/saas?topic=capabilities-automation-actions"]}
  aiops: {nota: 0.8, obs: "IA causal para causa raiz provável e investigação agêntica de incidentes (GA no SaaS), com limiares adaptativos e correlação de eventos. O assistente em linguagem natural, a sumarização e a remediação com watsonx estão em public preview.", fontes: ["https://www.ibm.com/docs/en/instana-observability/saas?topic=capabilities-intelligent-incident-investigation", "https://www.ibm.com/docs/en/instana-observability/saas?topic=capabilities-root-cause-analysis", "https://www.ibm.com/docs/en/instana-observability/saas?topic=alerts-instana-ai-assistant-public-preview"]}
  ia-llm: {nota: 0.8, obs: "Observabilidade GenAI via OpenLLMetry: provedores (watsonx.ai, OpenAI, Bedrock, Anthropic, Gemini), agentes (LangChain, LangGraph, CrewAI), tokens/custo, bancos vetoriais/RAG, GPU/vLLM e avaliação LLM-as-judge. Guardrails não documentados.", fontes: ["https://www.ibm.com/docs/en/instana-observability/saas?topic=capabilities-generative-ai-observability", "https://www.ibm.com/docs/en/instana-observability/saas?topic=features-ai-evaluation-in-instana"]}
  profiling: {nota: 0.85, obs: "AutoProfile contínuo para Java, Node.js, Go, Python, Ruby, .NET Core e PHP, ligado a traces. Também suporta o profiler eBPF do OpenTelemetry (Linux x86_64).", fontes: ["https://www.ibm.com/docs/en/instana-observability/saas?topic=instana-profile-processes", "https://www.ibm.com/docs/en/instana-observability/saas?topic=processes-opentelemetry-ebpf-profiler"]}
  dados-pipelines: {nota: 0.4, obs: "Métricas de Kafka, Spark/Hadoop YARN, Azure Databricks (Unity Catalog) e Snowflake. Sem observabilidade de dados (freshness, qualidade, linhagem), e Airflow não aparece na documentação.", fontes: ["https://www.ibm.com/docs/en/instana-observability/saas?topic=technologies-monitoring-azure-databricks", "https://www.ibm.com/docs/en/instana-observability/saas?topic=technologies-monitoring-snowflake"]}
  seguranca-governanca: {nota: 0.8, obs: "RBAC com times e escopos, SAML e MFA, trilha de auditoria (1 ano) e criptografia em trânsito e em repouso. Tem ISO 27001/27017/27018/27701, CSA STAR e SOC 2 Tipo 1; LGPD não é citada.", fontes: ["https://www.ibm.com/docs/en/instana-observability/saas?topic=instana-configuring-authentication", "https://www.ibm.com/docs/en/instana-observability/saas?topic=instana-viewing-audit-trail", "https://www.ibm.com/support/customer/csol/terms/?id=E7505A603A3611EBA94E77C5BC708D24"]}
  integracoes-itsm: {nota: 0.75, obs: "App ServiceNow ITSM bidirecional (incidentes, notas, fechamento), apps Slack e Teams (preview), webhooks, PagerDuty, Opsgenie e Cloud Pak for AIOps. Sem Jira nativo nem sincronização de CMDB documentada.", fontes: ["https://www.ibm.com/docs/en/instana-observability/saas?topic=alerts-setting-up-alert-channels", "https://www.ibm.com/docs/en/instana-observability/saas?topic=alerting-app-servicenow-itsm"]}
  plataforma: {nota: 0.9, obs: "SaaS em AWS/GCP (inclui São Paulo) com SLA de 99,9% e HA embutida, ou self-hosted Standard/Custom com as mesmas funções e suporte a air-gapped. A retenção do SaaS segue a política padrão (traces por 7 dias, métricas de 1 h por 13 meses).", fontes: ["https://www.ibm.com/docs/en/instana-observability/saas?topic=planning-instana-deployment-options", "https://www.ibm.com/support/customer/csol/terms/?id=i126-8959", "https://www.ibm.com/docs/en/instana-observability/saas?topic=planning-preparing-endpoints-keys"]}
destaques:
  - "Rastreamento automático (AutoTrace) de cada requisição com granularidade de 1 segundo e mais de 300 tecnologias suportadas sem plug-ins."
  - "Forte em ambientes legados IBM: agente para AIX, Solaris, IBM i e z/OS (USS), com tracing fim a fim em CICS, IMS e Db2 for z/OS e dados do OMEGAMON."
  - "Região SaaS documentada em São Paulo (AWS sa-east-1) e opção self-hosted com as mesmas funções do SaaS, inclusive para ambientes air-gapped."
  - "OpenTelemetry nativo (traces, métricas e logs em GA) e IA causal/agêntica para causa raiz provável e investigação de incidentes."
  - "Observabilidade de GenAI e agentes (tokens, custo, RAG, GPU/vLLM e avaliação de qualidade); o Instana é a base do Concert Observe na plataforma IBM Concert."
gaps:
  - "Não há session replay: o pedido 'Enhance EUM to include Session Replay' segue aberto no portal IBM Ideas."
  - "Logs são complementares: retenção padrão de 7 dias (até 90 via add-on) e sem pipelines, arquivamento/reidratação ou mascaramento de PII documentados."
  - "Métricas de 1 s ficam só 24 h; a retenção longa (≥13 meses) existe apenas com granularidade de 1 h."
  - "O DPA do Instana SaaS lista SOC 2 Tipo 1 (não Tipo 2) e não menciona a LGPD."
  - "O assistente de IA em linguagem natural, a sumarização de incidentes e a remediação com watsonx ainda estão em public preview; monitorar z/OS exige licença adicional."
  - "Sem observabilidade de dados (qualidade, freshness, linhagem) e sem integração nativa com Jira."
