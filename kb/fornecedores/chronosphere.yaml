id: chronosphere
nome: Chronosphere (Palo Alto Networks)
fabricante: Chronosphere, a Palo Alto Networks company
produto: Chronosphere Observability Platform
aliases: [Chronosphere]
entrega: [saas]
atualizado_em: 2026-09-29
ttl_dias: 180
confianca: Média
fatos:
  integracoes_nativas: {valor: 26, qualificador: null, texto: "Ingest metrics from cloud providers and the Chronosphere CXDOT Collector into Observability Platform.", fonte: "https://docs.chronosphere.io/ingest/xcor/integrations", verificado_em: 2026-09-29, obs: "Contagem própria: 23 integrações em /ingest/xcor/integrations/collector + 3 em /ingest/xcor/integrations/server; o fabricante não publica um total. O catálogo do Telemetry Pipeline (https://chronosphere.io/integrations/) lista à parte 89 plugins de origem/destino."}
  sla_disponibilidade_pct: {valor: 99.9, fonte: "https://chronosphere.io/availability-commitment/", verificado_em: 2026-09-29, obs: "SLA de três noves medido separadamente para Console, Ingest e Query; histórico declarado acima de 99,99%."}
  regiao_dados_brasil: {valor: NAO, fonte: "https://chronosphere.io/subprocessors/", verificado_em: 2026-09-29, obs: "Lista oficial de subprocessadores (atualizada em 24/01/2025): Google como provedor de nuvem com processamento em 'United States, European Union'; nenhuma menção a São Paulo."}
  suporte_ptbr: {valor: NAO_DOCUMENTADO, fonte: "https://docs.chronosphere.io/support", verificado_em: 2026-09-29, obs: "Suporte por portal e e-mail, com on-call 24x7 para tickets Urgent; idioma e presença local não mencionados."}
  agente_open_source: {valor: PARCIAL, texto: "Chronosphere Collector e CXDOT Collector são proprietários (binários, sem repositório em https://github.com/chronosphereio). A plataforma aceita nativamente o OpenTelemetry Collector e o Fluent Bit (Apache-2.0, https://github.com/fluent/fluent-bit), do qual o Core Agent é um fork enterprise.", fonte: "https://docs.chronosphere.io/ingest/pipeline/v2/fleets/agent", verificado_em: 2026-09-29}
  opentelemetry: {valor: SIM, fonte: "https://docs.chronosphere.io/ingest/otel-ingestion", verificado_em: 2026-09-29, obs: "Ingestão OTLP (gRPC/HTTP) de métricas, traces e logs; métricas OTel convertidas para formato compatível com Prometheus."}
  retencao_metricas_meses: {valor: null, fonte: "https://docs.chronosphere.io/administer/limits-licensing/definitions", verificado_em: 2026-09-29, obs: "Long Term Retention é o número de meses negociado em contrato 'at a negotiated resolution'; nenhum máximo publicado."}
  retencao_metricas_integral: {valor: NAO, fonte: "https://docs.chronosphere.io/control/shaping/shape-metrics/downsampling", verificado_em: 2026-09-29, obs: "Após ~5 dias toda métrica persistida passa por downsampling (padrão de 5 min) e os dados originais são apagados permanentemente."}
  so_suportados: {valor: [linux, windows, macos, arm], fonte: "https://docs.chronosphere.io/ingest/metrics-traces/collector/install/standalone", verificado_em: 2026-09-29, obs: "Binários Linux amd64/arm64, Windows x86-64 e macOS; nenhum binário para AIX, Solaris, HP-UX ou z/OS."}
  self_managed: {valor: NAO, fonte: "https://chronosphere.io/faqs/", verificado_em: 2026-09-29, obs: "SaaS com datastore e dashboards 'fully provided and managed by Chronosphere'; só o Telemetry Pipeline é híbrido/BYOC (data plane no ambiente do cliente)."}
  rum_mobile: {valor: NAO, fonte: "https://chronosphere.io/news/isv-partner-program-for-composable-observability/", verificado_em: 2026-09-29, obs: "Sem RUM nativo; RUM web/mobile apenas via parceiro Embrace."}
  session_replay: {valor: NAO, fonte: "https://chronosphere.io/news/isv-partner-program-for-composable-observability/", verificado_em: 2026-09-29, obs: "Sem session replay nativo; a experiência do usuário depende de parceiros ISV (Embrace, Checkly)."}
  certificacoes: {valor: [SOC2, ISO27001], fonte: "https://docs.chronosphere.io/compliance", verificado_em: 2026-09-29, obs: "SOC 2 Type 2 e ISO 27001. O trust.chronosphere.io agora é o Palo Alto Networks Trust Center e publica o 'Chronosphere SOC2 Report'; certificações PANW (ISO 27017/27018, FedRAMP) sem escopo Chronosphere confirmado."}
notas_base:
  coleta: {nota: 0.65, obs: "Coletores próprios (Chronosphere Collector/CXDOT) para Linux, Windows, macOS e ARM, ingestão OTLP, Prometheus, StatsD e DogStatsD e autodescoberta Kubernetes. O catálogo nativo é pequeno (26 integrações documentadas), complementado pelos plugins do Telemetry Pipeline.", fontes: ["https://docs.chronosphere.io/ingest", "https://docs.chronosphere.io/ingest/xcor/integrations/collector", "https://docs.chronosphere.io/ingest/metrics-traces/collector/install/standalone"]}
  infraestrutura: {nota: 0.55, obs: "Forte em Kubernetes/containers (kubelet, cAdvisor, estado do cluster, control plane) e nuvens via AWS CloudWatch, Azure Monitor e Google Cloud. Sem monitoramento nativo de rede (SNMP/fluxos) ou de storage.", fontes: ["https://docs.chronosphere.io/ingest/xcor/integrations/collector/kubernetes", "https://docs.chronosphere.io/ingest/xcor/integrations/server", "https://docs.chronosphere.io/ingest/xcor/integrations/collector/host"]}
  apm: {nota: 0.5, obs: "Tracing distribuído (módulo vendido à parte) com service pages, mapas de dependência e DDx para traces; recebe OTel, Jaeger, Zipkin e Datadog APM. Sem agentes APM próprios, auto-instrumentação ou visibilidade de código nativas.", fontes: ["https://docs.chronosphere.io/ingest/metrics-traces/collector", "https://docs.chronosphere.io/observe/services/extending-services", "https://docs.chronosphere.io/investigate/analyze/differential-diagnosis"]}
  logs: {nota: 0.6, obs: "Chronosphere Logs com parsers (regex/JSON/key-value), normalização, regras de controle (drop, sample, emit metric, replace) e análise de uso; mascaramento de PII pela regra redact/mask do Telemetry Pipeline. Live tail e arquivamento/reidratação não documentados.", fontes: ["https://docs.chronosphere.io/control/shaping/shape-logs/control-logs", "https://docs.chronosphere.io/ingest/pipeline/processing-rules/redact-mask-value", "https://chronosphere.io/news/chronosphere-logs-raises-bar-in-observability/"]}
  correlacao: {nota: 0.6, obs: "Service pages reúnem métricas, traces, logs e monitores, com change events (módulo à parte) e mapas de dependência baseados em traces. O Temporal Knowledge Graph ainda está em disponibilidade limitada.", fontes: ["https://docs.chronosphere.io/observe/services/extending-services", "https://docs.chronosphere.io/observe/services", "https://chronosphere.io/ai-guided-troubleshooting/"]}
  banco-dados: {nota: 0.25, obs: "Somente métricas de MySQL 8.4+, PostgreSQL 16+, ClickHouse e Memcached via CXDOT. Sem SQL Server, Oracle ou MongoDB nativos e sem consultas lentas ou planos de execução.", fontes: ["https://docs.chronosphere.io/ingest/xcor/integrations/collector", "https://docs.chronosphere.io/ingest/xcor/integrations/collector/mysql"]}
  experiencia-usuario: {nota: 0.15, obs: "Sem RUM, session replay ou sintético nativos, apenas checks HTTP/TCP no coletor. O fabricante cobre a lacuna com parceiros (Embrace para RUM, Checkly para sintético).", fontes: ["https://chronosphere.io/news/isv-partner-program-for-composable-observability/", "https://docs.chronosphere.io/ingest/xcor/integrations/collector"]}
  alertas-dashboards: {nota: 0.75, obs: "Dashboards padrão e clássicos (import Grafana), monitores PromQL/logs com signals, muting e simulação de alertas, SLOs com error budget e alertas de burn rate, tudo como código. Escalonamento depende de PagerDuty, OpsGenie etc.", fontes: ["https://docs.chronosphere.io/observe/slo", "https://docs.chronosphere.io/investigate/alerts/monitors", "https://docs.chronosphere.io/investigate/alerts/notifications/notifiers"]}
  aiops: {nota: 0.4, obs: "DDx (causa provável por correlação) e consultas em linguagem natural disponíveis; o assistente Operator está em Early Access e Suggestions em disponibilidade limitada. Sem detecção de anomalias ou previsão documentadas.", fontes: ["https://docs.chronosphere.io/investigate/analyze/differential-diagnosis", "https://docs.chronosphere.io/navigate/operator", "https://chronosphere.io/ai-guided-troubleshooting/"]}
  ia-llm: {nota: 0.3, obs: "LLM e agentes monitorados via convenções OpenTelemetry GenAI (tokens e custo por modelo), métricas de avaliação e traces em dashboards genéricos. Avaliação de qualidade e guardrails dependem do parceiro Arize.", fontes: ["https://chronosphere.io/learn/monitoring-llms-and-autonomous-agents/", "https://chronosphere.io/news/isv-partner-program-for-composable-observability/"]}
  profiling: {nota: 0.1, obs: "Sem continuous profiling nativo; o fabricante indica o parceiro Polar Signals.", fontes: ["https://chronosphere.io/news/isv-partner-program-for-composable-observability/"]}
  dados-pipelines: {nota: 0.15, obs: "Sem observabilidade de dados (freshness, qualidade, linhagem); apenas métricas de Apache Spark e Temporal via CXDOT.", fontes: ["https://docs.chronosphere.io/ingest/xcor/integrations/collector"]}
  seguranca-governanca: {nota: 0.7, obs: "RBAC por times e papéis, SSO (Okta, Duo, Azure AD, Google), audit log, AES-256/TLS 1.2+, single-tenant, SOC 2 Type 2 e ISO 27001. LGPD não documentada.", fontes: ["https://docs.chronosphere.io/overview/authenticating", "https://chronosphere.io/security-overview/", "https://docs.chronosphere.io/compliance"]}
  integracoes-itsm: {nota: 0.4, obs: "Notificadores nativos para Slack, PagerDuty, OpsGenie, VictorOps, e-mail, incident.io e webhook, além de APIs, Terraform e MCP server (somente leitura). Sem ServiceNow, Jira, CMDB ou Microsoft Teams nativos.", fontes: ["https://docs.chronosphere.io/investigate/alerts/notifications/notifiers", "https://docs.chronosphere.io/integrate/mcp-server"]}
  plataforma: {nota: 0.55, obs: "SaaS single-tenant com SLA de 99,9% por componente, três réplicas entre zonas de disponibilidade e retenção negociada em contrato. Sem opção self-managed e com processamento declarado só nos EUA e na UE.", fontes: ["https://chronosphere.io/availability-commitment/", "https://chronosphere.io/subprocessors/", "https://chronosphere.io/faqs/"]}
destaques:
  - "A Palo Alto Networks concluiu a aquisição em 29/01/2026 (anunciada em 19/11/2025); Martin Mao virou SVP/GM de Observabilidade e a integração planejada com o Cortex AgentiX mira remediação autônoma."
  - "O controle de custo e cardinalidade é o diferencial: regras de agregação, drop, partições e budgets e análise de uso para métricas, logs e traces."
  - "Arquitetura single-tenant com SLA de 99,9% medido separadamente para console, ingestão e consulta, com histórico declarado acima de 99,99%."
  - "Aberta a padrões: ingestão OTLP nativa, 100% compatível com PromQL e patrocinadora do Fluent Bit (Apache-2.0)."
  - "O Telemetry Pipeline continua como produto standalone e ganhou em fev/2026 um destino Cortex XSIAM, útil em cenários SecOps/SIEM."
  - "Recursos de IA disponíveis: MCP server GA, consultas em linguagem natural e DDx para investigação."
gaps:
  - "Sem RUM, session replay, sintético, profiling ou observabilidade de LLM nativos; o próprio fabricante recorre a parceiros (Embrace, Checkly, Polar Signals, Arize)."
  - "Sem opção self-managed e sem região no Brasil: os subprocessadores listam processamento apenas nos EUA e na UE."
  - "Métricas sofrem downsampling para 5 min após ~5 dias, e a retenção longa é negociada em contrato, sem máximo publicado."
  - "Catálogo nativo pequeno e cobertura fraca de bancos (sem SQL Server, Oracle, MongoDB ou slow queries) e de ITSM (sem ServiceNow/Jira)."
  - "Roadmap pós-aquisição incerto: integração com o Cortex ainda planejada, novo coletor CXDOT já com domínio paloaltonetworks.com e IA (Operator em EA, Suggestions em disponibilidade limitada) ainda não GA."
  - "Suporte em português ou presença local no Brasil não documentados; tracing e change events são módulos licenciados à parte."
