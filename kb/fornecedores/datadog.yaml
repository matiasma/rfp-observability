notas_base:
  coleta:
    nota: 0.9
    obs: "Ampla cobertura de agentes, APIs, OpenTelemetry e mais de 1.000 integrações documentadas; há lacuna para AIX nativo."
    fontes: ["https://docs.datadoghq.com/integrations/", "https://docs.datadoghq.com/opentelemetry/"]
  infraestrutura:
    nota: 1.0
    obs: "Cobertura nativa de hosts, containers, Kubernetes, nuvens públicas, rede e processos."
    fontes: ["https://docs.datadoghq.com/infrastructure/", "https://docs.datadoghq.com/integrations/"]
  apm:
    nota: 1.0
    obs: "APM e tracing distribuído maduros, com auto-instrumentação e suporte a múltiplas linguagens."
    fontes: ["https://docs.datadoghq.com/tracing/", "https://docs.datadoghq.com/opentelemetry/"]
  logs:
    nota: 1.0
    obs: "Gestão de logs com pipelines, live tail, métricas a partir de logs, arquivamento e reidratação."
    fontes: ["https://docs.datadoghq.com/logs/"]
  correlacao:
    nota: 1.0
    obs: "Correlação nativa entre traces, logs, métricas, RUM, sintéticos, perfis e DBM."
    fontes: ["https://docs.datadoghq.com/tracing/other_telemetry/", "https://docs.datadoghq.com/tracing/"]
  banco-dados:
    nota: 1.0
    obs: "DBM cobre engines relacionais e NoSQL relevantes com métricas, amostras e planos conforme tecnologia."
    fontes: ["https://docs.datadoghq.com/database_monitoring/"]
  experiencia-usuario:
    nota: 1.0
    obs: "RUM web/mobile, Session Replay e sintéticos são recursos nativos da plataforma."
    fontes: ["https://docs.datadoghq.com/real_user_monitoring/", "https://docs.datadoghq.com/synthetics/"]
  alertas-dashboards:
    nota: 1.0
    obs: "Monitores, dashboards, SLOs e automações estão integrados à experiência operacional."
    fontes: ["https://docs.datadoghq.com/service_management/service_level_objectives/", "https://docs.datadoghq.com/synthetics/"]
  aiops:
    nota: 0.9
    obs: "Recursos de detecção e assistência operacional são fortes, embora a experiência plena favoreça componentes Datadog."
    fontes: ["https://docs.datadoghq.com/tracing/", "https://docs.datadoghq.com/tracing/other_telemetry/"]
  ia-llm:
    nota: 0.75
    obs: "LLM Observability cobre traces, tokens, custo, latência e avaliação, mas é uma área em evolução."
    fontes: ["https://docs.datadoghq.com/llm_observability/"]
  profiling:
    nota: 1.0
    obs: "Continuous Profiler é nativo e correlacionável com traces em várias linguagens."
    fontes: ["https://docs.datadoghq.com/profiler/"]
  dados-pipelines:
    nota: 0.75
    obs: "Há observabilidade para jobs e streams de dados, com foco em confiabilidade e lineage de pipelines."
    fontes: ["https://docs.datadoghq.com/data_observability/jobs_monitoring/", "https://docs.datadoghq.com/tracing/other_telemetry/"]
  seguranca-governanca:
    nota: 1.0
    obs: "RBAC, SSO, trilha de auditoria e controles de dados são bem documentados."
    fontes: ["https://docs.datadoghq.com/account_management/rbac/", "https://docs.datadoghq.com/account_management/audit_trail/"]
  integracoes-itsm:
    nota: 1.0
    obs: "Integração ServiceNow e ecossistema de notificações/colaboração são nativos."
    fontes: ["https://docs.datadoghq.com/integrations/servicenow/", "https://docs.datadoghq.com/integrations/"]
  plataforma:
    nota: 0.75
    obs: "SaaS maduro com SLA público e múltiplos sites globais; não há residência de dados no Brasil nem opção self-managed."
    fontes: ["https://docs.datadoghq.com/getting_started/site/", "https://www.datadoghq.com/legal/msa/"]
destaques:
  - "Catálogo de integrações muito amplo e oficialmente documentado."
  - "APM, logs, DBM, RUM, sintéticos e profiling aparecem de forma integrada."
  - "Agente principal tem código público e OpenTelemetry é suportado."
  - "Recursos para LLM e pipelines de dados ampliam a cobertura além da observabilidade tradicional."
gaps:
  - "Não há região de dados no Brasil."
  - "AIX não é suportado nativamente pelo agente principal."
  - "Algumas retenções operacionais são curtas por produto ou dependem do plano."
  - "A experiência mais completa pode favorecer componentes proprietários do fabricante."
