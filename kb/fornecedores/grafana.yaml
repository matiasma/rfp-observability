    nota: 0.5
    obs: "Faro cobre RUM web; RUM mobile não é GA e Session Replay estava em preview."
    fontes: ["https://grafana.com/docs/grafana-cloud/observe-and-act/monitor-applications/frontend-observability/", "https://grafana.com/docs/grafana-cloud/observe-and-act/monitor-applications/session-replay/how-it-works/"]
  alertas-dashboards:
    nota: 0.75
    obs: "Dashboards são referência de mercado e há alerting/SLO; automação avançada pode exigir composição com IRM."
    fontes: ["https://grafana.com/docs/grafana-cloud/alerting-and-irm/slo/", "https://grafana.com/docs/grafana-cloud/alerting-and-irm/irm/"]
  aiops:
    nota: 0.5
    obs: "Há recursos de ML/LLM auxiliares, mas AIOps turnkey é menos maduro que nos líderes proprietários."
    fontes: ["https://grafana.com/docs/grafana-cloud/machine-learning/llm/", "https://grafana.com/docs/grafana-cloud/alerting-and-irm/irm/"]
  ia-llm:
    nota: 0.25
    obs: "Não há LLM observability turnkey comparável a plataformas especializadas; o caminho é instrumentação OTel e composição."
    fontes: ["https://grafana.com/docs/grafana-cloud/machine-learning/llm/", "https://grafana.com/docs/grafana-cloud/observe-and-act/monitor-applications/application-observability/"]
  profiling:
    nota: 0.75
    obs: "Pyroscope fornece profiling contínuo forte, com cobertura variável por linguagem e runtime."
    fontes: ["https://grafana.com/docs/pyroscope/latest/"]
  dados-pipelines:
    nota: 0.5
    obs: "Pipelines de dados são observáveis por métricas/logs/exporters; freshness, lineage e data quality não são nativos."
    fontes: ["https://grafana.com/docs/grafana-cloud/monitor-infrastructure/integrations/integration-reference/"]
  seguranca-governanca:
    nota: 0.75
    obs: "SAML, RBAC e audit logs existem em Cloud/Enterprise, com parte dos recursos fora do OSS puro."
    fontes: ["https://grafana.com/docs/grafana/latest/setup-grafana/configure-security/configure-authentication/saml/", "https://grafana.com/docs/grafana/latest/setup-grafana/configure-security/audit-grafana/"]
  integracoes-itsm:
    nota: 0.75
    obs: "IRM/OnCall/Incident e integrações como ServiceNow cobrem fluxos ITSM, com dependência de configuração e plano."
    fontes: ["https://grafana.com/docs/grafana-cloud/alerting-and-irm/irm/"]
  plataforma:
    nota: 0.75
    obs: "Oferece SaaS e self-managed/OSS, com região no Brasil; SLA padrão é 99,5% e retenção acima do padrão pode ser comercial."
    fontes: ["https://grafana.com/legal/grafana-cloud-sla/", "https://grafana.com/docs/grafana-cloud/platform/security-and-account-management/account-management/regional-availability/", "https://grafana.com/docs/alloy/latest/"]
destaques:
  - "Stack aberta e auditável, alinhada a OpenTelemetry e Prometheus."
  - "Região de dados no Brasil está documentada para Grafana Cloud."
  - "Dashboards, logs, métricas, traces e profiling têm forte integração."
  - "Há opções SaaS e self-managed/OSS para diferentes modelos de operação."
gaps:
  - "RUM mobile não é GA nativo."
  - "Session Replay estava em preview e não deve contar como GA."
  - "DBM profundo e data observability dedicada dependem de exporters ou composição."
  - "SLA padrão publicado é 99,5%."
