id: elastic
nome: Elastic
fabricante: Elastic N.V.
produto: "Elastic Observability (Elastic Cloud Serverless, Elastic Cloud Hosted e Elastic Stack self-managed)"
aliases: ["Elastic Stack", "ELK", "ELK Stack", "Elastic Cloud", "Elastic Cloud Serverless", "Elastic Cloud Hosted", "Elastic APM", "Elasticsearch", "Kibana", "EDOT"]
entrega: [saas, self-managed]
atualizado_em: 2026-09-29
ttl_dias: 180
confianca: Alta
fatos:
  integracoes_nativas: {valor: 450, qualificador: "mais de", texto: "450+ one-click integrations across clouds, CI/CD, databases, and more.", fonte: "https://www.elastic.co/observability", verificado_em: 2026-09-29, obs: "Os números oficiais divergem: a documentação cita 'over 300 turn-key integrations' e a página de infraestrutura cita '550+'. O catálogo https://www.elastic.co/integrations/data-integrations exibia 488 entradas em 2026-09-29, das quais 209 marcadas como Observability."}
  sla_disponibilidade_pct: {valor: 99.95, fonte: "https://www.elastic.co/pdf/elastic-service-level-agreement-ech-global-v09122025-1.pdf", verificado_em: 2026-09-29, obs: "Monthly Uptime Percentage de 99,95% para assinaturas Platinum/Enterprise, com créditos de serviço. No Hosted, exige deployment HA (2+ zonas). O Serverless tem o mesmo alvo (https://www.elastic.co/agreements/sla-elastic-cloud-serverless)."}
  regiao_dados_brasil: {valor: SIM, fonte: "https://www.elastic.co/docs/reference/cloud/cloud-hosted/regions", verificado_em: 2026-09-29, obs: "Hosted: AWS sa-east-1, GCP southamerica-east1 e Azure brazilsouth (São Paulo). Serverless: somente Azure brazilsouth (https://www.elastic.co/docs/deploy-manage/deploy/elastic-cloud/regions)."}
  suporte_ptbr: {valor: NAO_DOCUMENTADO, fonte: "https://www.elastic.co/support_policy", verificado_em: 2026-09-29, obs: "A política de suporte (vigente desde 2026-09-07) exige que o pessoal do cliente tenha 'sufficient English language' skills. Atendimento em português não é documentado. A UI do Kibana é localizada apenas em EN, ZH, FR, JA e DE (https://www.elastic.co/subscriptions)."}
  agente_open_source: {valor: SIM, texto: "Todo o código é público no GitHub. O Elastic Agent (com coletor OpenTelemetry embutido) usa a Elastic License 2.0, que é source-available e não OSI (https://github.com/elastic/elastic-agent). SDKs EDOT e agentes APM usam Apache-2.0 (ex.: https://github.com/elastic/elastic-otel-java, https://github.com/elastic/apm-agent-android). O agente RUM JS usa MIT. Beats são Apache-2.0 fora de x-pack.", fonte: "https://github.com/elastic/elastic-agent/blob/main/LICENSE.txt", verificado_em: 2026-09-29}
  opentelemetry: {valor: SIM, fonte: "https://www.elastic.co/docs/reference/opentelemetry/managed-inputs/managed-otlp-endpoint", verificado_em: 2026-09-29, obs: "O Managed OTLP Endpoint (GA no Serverless e no Hosted) ingere OTLP nativamente, sem APM Server. Em self-managed, ECE e ECK, usa-se o Elastic Agent em modo gateway. Distribuições EDOT GA: coletor (embutido no Elastic Agent 9.5), Java, .NET, Node.js, Python, PHP, Android e iOS."}
  retencao_metricas_meses: {valor: null, fonte: "https://www.elastic.co/docs/manage-data/lifecycle/data-stream/tutorial-data-stream-retention", verificado_em: 2026-09-29, obs: "Não há teto publicado. A retenção é definida pelo cliente por data stream (ILM ou data stream lifecycle) e, sem retenção configurada, o dado é mantido indefinidamente. No Serverless, cobra-se por GB retido por mês."}
  retencao_metricas_integral: {valor: SIM, fonte: "https://www.elastic.co/docs/manage-data/lifecycle/data-stream", verificado_em: 2026-09-29, obs: "O downsampling de séries temporais é opcional ('If downsampling is configured'). A granularidade original pode ser mantida por todo o período, com custo de armazenamento."}
  so_suportados: {valor: [linux, windows, macos, arm], fonte: "https://www.elastic.co/support/matrix", verificado_em: 2026-09-29, obs: "Elastic Agent 9.5: RHEL 7-10, Ubuntu 18.04-24.04, Debian 11-13, SLES 15, Oracle/Alma/Rocky Linux e Amazon Linux 2023; Windows 10/11 e Server 2012 R2-2025; macOS 12-26; aarch64 em Linux e macOS. AIX e Solaris constam como não suportados para Beats. O agente APM Java lista HP-UX JVM e IBM J9."}
  self_managed: {valor: SIM, fonte: "https://www.elastic.co/docs/deploy-manage/deploy", verificado_em: 2026-09-29, obs: "Elastic Stack self-managed, Elastic Cloud Enterprise (ECE) e Elastic Cloud on Kubernetes (ECK), com instalação air-gapped documentada."}
  rum_mobile: {valor: SIM, fonte: "https://www.elastic.co/docs/reference/opentelemetry", verificado_em: 2026-09-29, obs: "EDOT Android 1.10.0 e EDOT iOS 2.1.0 são GA no Serverless e no Stack, com tracing distribuído, sessões via session.id, alertas e dashboards."}
  session_replay: {valor: NAO, fonte: "https://github.com/elastic/roadmap/issues/390", verificado_em: 2026-09-29, obs: "Não há documentação oficial de session replay. Os SDKs de RUM (RUM JS e EDOT Browser/Android/iOS) oferecem apenas 'session review' por session.id. O roadmap público ainda traz 'RUM Session Management' em aberto (2026-08)."}
  certificacoes: {valor: [ISO27001, ISO27017, ISO27018, ISO27701, SOC2, SOC3, PCI-DSS, HIPAA, FedRAMP-High, FedRAMP-Moderate, CSA-STAR, TISAX, IRAP, Cyber-Essentials-Plus], fonte: "https://assurance.elastic.co", verificado_em: 2026-09-29, obs: "Trust Center atualizado em 2026-09-24 (SOC 2 Tipo 2; AOC PCI DSS v4.0.1). A ISO 27701 cobre Cloud, Serverless e self-managed. A página https://www.elastic.co/trust lista a maior parte dessas certificações."}
notas_base:
  coleta: {nota: 0.85, obs: "Elastic Agent gerenciado pelo Fleet, com coletor OTel embutido, SDKs EDOT, 450+ integrações, endpoint OTLP gerenciado e autodiscovery por hints no Kubernetes. Cobre Linux, Windows, macOS e ARM, mas não AIX, Solaris ou HP-UX.", fontes: ["https://www.elastic.co/docs/reference/edot-collector", "https://www.elastic.co/support/matrix", "https://www.elastic.co/docs/reference/fleet/elastic-agent-kubernetes-autodiscovery"]}
  infraestrutura: {nota: 0.8, obs: "Cobre hosts, Kubernetes, AWS/Azure/GCP, vSphere, NetFlow e serverless (Lambda), com PROMQL GA no ES|QL 9.5. SNMP só via receiver OTel 'Extended' (fora do SLA) ou Logstash, sem módulo NPM dedicado.", fontes: ["https://www.elastic.co/docs/reference/edot-collector/components", "https://www.elastic.co/docs/reference/opentelemetry/compatibility/nomenclature", "https://www.elastic.co/docs/reference/query-languages/esql/commands/promql"]}
  apm: {nota: 0.8, obs: "Agentes APM (Java, .NET, Go, Node.js, PHP, Python, Ruby) e SDKs EDOT com instrumentação zero-code, tracing distribuído, erros e correlações de latência e falhas. A visibilidade de código se limita a spans, stack traces e profiling de CPU.", fontes: ["https://www.elastic.co/docs/reference/apm-agents", "https://www.elastic.co/docs/reference/opentelemetry", "https://www.elastic.co/docs/solutions/observability/apm/find-transaction-latency-failure-correlations"]}
  logs: {nota: 0.95, obs: "Ponto mais forte: pipelines de ingestão, Streams com parsing por IA (GA), ES|QL, busca e tail no Discover, busca direta em snapshots (cold/frozen) e redact processor para PII.", fontes: ["https://www.elastic.co/docs/solutions/observability/streams/streams", "https://www.elastic.co/docs/solutions/observability/logs/explore-logs", "https://www.elastic.co/docs/reference/ingest-processor/redact-processor"]}
  correlacao: {nota: 0.75, obs: "Permite ir do log ao trace via trace.id na UI de APM, com service map que mostra anomalias de ML e análise de correlações. O mapa depende de tracing distribuído e não há topologia full-stack automática documentada.", fontes: ["https://www.elastic.co/docs/solutions/observability/apm/service-map", "https://www.elastic.co/docs/solutions/observability/apm/logs"]}
  banco-dados: {nota: 0.5, obs: "Integrações para SQL Server, Oracle (sysmetric, tablespace), PostgreSQL (pg_stat_statements), MySQL (slowlog) e MongoDB, além de receivers OTel 'Extended' (fora do SLA). Não há captura de planos de execução documentada.", fontes: ["https://www.elastic.co/docs/reference/integrations/mysql", "https://www.elastic.co/docs/reference/integrations/postgresql", "https://www.elastic.co/docs/reference/integrations/oracle"]}
  experiencia-usuario: {nota: 0.55, obs: "Synthetics GA (HTTP/TCP/ICMP e browser, em locais gerenciados e privados) e mobile GA via EDOT Android/iOS. RUM web é GA só no Stack (agente RUM JS indisponível no Serverless; EDOT Browser em technical preview) e não há session replay.", fontes: ["https://www.elastic.co/docs/solutions/observability/synthetics", "https://www.elastic.co/docs/solutions/observability/applications/user-experience", "https://www.elastic.co/docs/reference/opentelemetry/edot-sdks/browser"]}
  alertas-dashboards: {nota: 0.8, obs: "Dashboards Kibana, regras de alerta com conectores, janelas de manutenção, SLOs com error budget e burn rate (GA) e Workflows GA para automação e runbooks. Escalonamento e on-call dependem de ferramentas externas (PagerDuty, Opsgenie).", fontes: ["https://www.elastic.co/docs/solutions/observability/incident-management/service-level-objectives-slos", "https://www.elastic.co/docs/explore-analyze/workflows", "https://www.elastic.co/docs/reference/kibana/connectors-kibana"]}
  aiops: {nota: 0.75, obs: "Detecção de anomalias por ML (100+ jobs prontos), AIOps Labs GA (log rate analysis, padrões de log, change points) e Elastic AI Agent/Agent Builder GA em linguagem natural. A causa raiz é assistida e os recursos generativos exigem conector LLM.", fontes: ["https://www.elastic.co/docs/explore-analyze/machine-learning/machine-learning-in-kibana/xpack-ml-aiops", "https://www.elastic.co/docs/explore-analyze/ai-features/elastic-agent-builder", "https://www.elastic.co/docs/explore-analyze/machine-learning/anomaly-detection"]}
  ia-llm: {nota: 0.6, obs: "Integrações para Bedrock/AgentCore, Anthropic, Azure OpenAI/AI Foundry, Vertex AI e OpenAI, além de tracing EDOT com modelo, tokens, prompts e respostas, dashboards de custo e guardrails do Bedrock. Avaliação de qualidade e de RAG não documentada.", fontes: ["https://www.elastic.co/docs/solutions/observability/applications/llm-observability"]}
  profiling: {nota: 0.6, obs: "Universal Profiling (eBPF, sempre ativo, sem instrumentação) é GA no Stack, porém só CPU/Linux e indisponível no Serverless. A integração OpenTelemetry Profiling está em preview (9.4+).", fontes: ["https://www.elastic.co/docs/solutions/observability/infra-and-hosts/universal-profiling", "https://www.elastic.co/docs/reference/integrations/profiling_otel"]}
  dados-pipelines: {nota: 0.35, obs: "Há apenas integrações de métricas e logs para Airflow (via StatsD), Kafka e Apache Spark. Não há recursos de freshness, qualidade ou linhagem de dados.", fontes: ["https://www.elastic.co/docs/reference/integrations/airflow", "https://www.elastic.co/docs/reference/integrations/kafka", "https://www.elastic.co/docs/reference/integrations/apache_spark"]}
  seguranca-governanca: {nota: 0.9, obs: "RBAC com segurança em nível de documento e campo, SSO SAML/OIDC, MFA obrigatório no Elastic Cloud, audit logging, chave gerenciada pelo cliente e certificações ISO 27001/27701, SOC 2, PCI DSS e FedRAMP High. Há recursos de privacidade para LGPD.", fontes: ["https://assurance.elastic.co", "https://www.elastic.co/docs/cloud-account/multifactor-authentication", "https://www.elastic.co/docs/deploy-manage/security/logging-configuration/security-event-audit-logging"]}
  integracoes-itsm: {nota: 0.8, obs: "Conectores nativos para ServiceNow ITSM/ITOM/SecOps, Jira/JSM, Teams, Slack, PagerDuty, Opsgenie e webhook; os Cases enviam atualizações ao Jira e ao ServiceNow. A integração ServiceNow ingere tabelas de CMDB, sem sincronização bidirecional documentada.", fontes: ["https://www.elastic.co/docs/reference/kibana/connectors-kibana", "https://www.elastic.co/docs/explore-analyze/cases", "https://www.elastic.co/docs/reference/integrations/servicenow"]}
  plataforma: {nota: 0.9, obs: "SaaS (Serverless e Hosted em AWS/Azure/GCP, com região em São Paulo) e self-managed (Stack, ECE, ECK, air-gapped), SLA de 99,95%, snapshots e replicação entre clusters para DR e retenção configurável. Suporte 24x7 com resposta de 1h em Sev1 (Platinum/Enterprise), mas em inglês.", fontes: ["https://www.elastic.co/docs/deploy-manage/deploy", "https://www.elastic.co/pricing", "https://www.elastic.co/support_policy"]}
destaques:
  - "Plataforma única sobre Elasticsearch para logs, métricas, traces e profiling, entregue como SaaS (Serverless/Hosted) ou self-managed (Stack, ECE, ECK, inclusive air-gapped)."
  - "OpenTelemetry nativo: endpoint OTLP gerenciado, coletor OTel embutido no Elastic Agent 9.5 e SDKs EDOT Apache-2.0, com Android e iOS GA."
  - "Residência de dados em São Paulo (AWS, GCP e Azure no Hosted; Azure no Serverless) e SLA publicado de 99,95%."
  - "Retenção definida pelo cliente, sem teto publicado, com downsampling opcional e camadas cold/frozen em searchable snapshots."
  - "Forte em logs e análise: Streams com parsing por IA, ES|QL (inclusive PROMQL GA no 9.5), AIOps por ML e redação de PII na ingestão."
  - "Amplo portfólio de certificações (ISO 27001/27017/27018/27701, SOC 2 Tipo 2, PCI DSS, HIPAA, FedRAMP High) e conectores ITSM nativos (ServiceNow, Jira, Teams, Slack)."
gaps:
  - "Não há session replay. RUM web é GA só no Stack (agente RUM JS indisponível no Serverless) e o EDOT Browser ainda está em technical preview."
  - "O suporte oficial exige proficiência em inglês; atendimento em português não é documentado e o Kibana não tem localização PT-BR."
  - "Não há agentes para AIX, Solaris, HP-UX ou z/OS; a matriz de suporte marca AIX e Solaris como não suportados."
  - "O monitoramento de bancos não captura planos de execução e não há observabilidade de dados (freshness, qualidade, linhagem)."
  - "Universal Profiling se limita a CPU/Linux e é indisponível no Serverless; o profiling via OTel ainda está em preview."
  - "O Elastic Agent usa Elastic License 2.0 (source-available, não OSI); só SDKs EDOT, agentes APM e Beats OSS são Apache-2.0."
