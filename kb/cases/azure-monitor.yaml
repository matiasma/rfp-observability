  organizacao: ASOS
  setor: Varejo de moda online
  pais: Reino Unido
  cenario: 'Substituição do monitoramento legado por Azure Monitor: visão única da jornada do cliente entre microsserviços.'
  resultados:
  - Alertas de até 15 minutos passaram a quase tempo real.
  - Application Insights para APM em nível de código e dependências entre ~80 microsserviços; Log Analytics como painel único.
  - Action Groups notificando as equipes por limiares; APIs com 10.000 requisições/s na Black Friday sem incidentes maiores.
  solucao: Azure Monitor (Application Insights, Log Analytics, Action Groups)
