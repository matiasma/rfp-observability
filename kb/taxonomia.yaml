# Taxonomia canônica de observabilidade — fixa entre RFPs.
# É ela que permite reaproveitar as notas dos fornecedores (kb/fornecedores/*.yaml) de um edital para outro.
# Palavras-chave: minúsculas e SEM acento (o texto é normalizado antes da comparação). Termos de até 4 letras casam
# só a palavra inteira; os demais casam por prefixo de palavra ("instrumenta" casa "instrumentação").
# palavras_chave valem 1 ponto; palavras_fracas (termos genéricos que aparecem em muitos assuntos) valem 0,5.
# Título do bloco/seção pesa 2x (+1 para a categoria do primeiro termo forte do título); texto do requisito 1x.

versao: 1

regua:
  1.0: nativo-líder
  0.75: forte
  0.5: parcial / por extensão
  0.25: fraco
  0.0: não atende

categorias:
