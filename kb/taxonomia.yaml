    nome: Coleta, agentes, OpenTelemetry e integrações
    escopo: produto
    descricao: Agentes/coletores (inclusive open source e OTel), cobertura de sistemas operacionais, catálogo de integrações, APIs de ingestão e autodescoberta.
    palavras_chave: [coletor, coletores, collector, opentelemetry, otel, otlp, instrumenta, agente unico, agentes de coleta, integracao nativa, integracoes nativas, catalogo de integracoes, exporter, prometheus, statsd, agentless, sem agente, autodescoberta, auto-descoberta, descoberta automatica, sistema operacional, sistemas operacionais, aix, solaris, hp-ux, macos, codigo aberto, open source, codigo-fonte]
    palavras_fracas: [agente, agentes, coleta, ingestao, telemetria, plugin, plugins, integracoes]

