# Histórico do Gartner Magic Quadrant da categoria de observabilidade, por edição.
# Usado para: (1) montar a lista de fornecedores (Líderes da edição vigente) e (2) avaliar gates do tipo
# "Líder no Quadrante Mágico pelos últimos N anos".
#
# Atualize TODO ANO quando a nova edição sair (normalmente julho). Ids = ids de kb/fornecedores/*.yaml.
# Observação: o MQ foi RENOMEADO — "Application Performance Monitoring and Observability" (até 2023)
# -> "Observability Platforms" (2024+). Editais que citam o nome antigo geram ambiguidade: o kit sinaliza.
#
# Nomes dos quadrantes: lider | desafiante | visionario | nicho. Fornecedor ausente da edição = não avaliado.

# Última revisão: 2026-09-29 (posições lidas dos gráficos oficiais republicados por fornecedores + Network World).

# revisado_em: última conferência de que não há edição mais nova (a execução assistida exige que seja recente).
revisado_em: 2026-09-29

