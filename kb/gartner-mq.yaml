    obs: "Lista completa (19 fornecedores) confirmada pelo texto da Network World (Denise Dubie, 16/07/2026) e pelo gráfico oficial Gartner 'As of May 2026' publicado pela Elastic. Splunk CONFIRMADO como Desafiante: no gráfico fica à esquerda da linha vertical, e não há press release Cisco/Splunk de 'Leader' em 2026 (a URL no padrão 'fourth consecutive year' do newsroom da Cisco dá 404; as equivalentes de 2024/2025 existem). Autores: Padraig Byrne, Martin Caren, D.B. Cummings, Neil Young. Mudanças vs 2025 (comparando os gráficos): Coralogix Visionário→Líder; Splunk Líder→Desafiante; BMC Helix Nicho→Visionário; ScienceLogic e Apica Visionário→Nicho; entraram Alibaba Cloud e HPE; saíram Oracle, ITRS e Sumo Logic."
